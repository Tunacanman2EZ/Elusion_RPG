<title>Elusion RPG</title>
<!--
	Elusion's loader: the page a player sees while the game downloads.

	Set as html/custom_html_shell in export_presets.cfg. The $GODOT_ names are
	filled in by the exporter. The picture behind the loader is the login
	screen's own, art/menu/original size.png, embedded so the export is still
	one folder; if that picture changes, re-embed it:
	    python -c "import base64;print(base64.b64encode(open('art/menu/original size.png','rb').read()).decode())"
	The loader stays over the game until the login screen has drawn once
	(window.elusionReady, called from loginmenu.gd), so the page goes from this
	straight to that screen with nothing in between.
-->
<style>
:root {
	--night: #0b0a0f;
	--panel: rgba(24, 20, 16, 0.92);
	--edge: #8c734d;
	--edge-bright: #a68c59;
	--title-bg: #33291f;
	--parchment: #ecdcb8;
	--muted: #bfb79e;
	--gold: #d9b86b;
	--amber: #e19339;
	--error: #ff8a7a;
}
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
body {
	background: var(--night);
	color: var(--parchment);
	overflow: hidden;
	touch-action: none;
	font-family: "Noto Sans", "Open Sans", "Segoe UI", system-ui, sans-serif;
}
#canvas {
	display: block;
}
#canvas:focus {
	outline: none;
}
#loader {

	inset: 0;

	display: flex;
	align-items: center;
	justify-content: flex-end;
	padding-right: max(19vw, 16px);
	transition: opacity 0.35s ease;
	z-index: 1;
}
#loader.gone {
	opacity: 0;
	pointer-events: none;
}
.panel {
	box-sizing: border-box;
	width: min(300px, calc(100vw - 32px));
	padding: 26px 26px 24px;
	background: var(--panel);
	border: 3px solid var(--edge);
	border-radius: 3px;
	text-align: center;
	image-rendering: auto;
}
.title {
	margin: 0 0 20px;
	padding: 6px 0 7px;
	background: var(--title-bg);
	border: 2px solid var(--edge-bright);
	border-radius: 3px;
	font-size: 26px;
	font-weight: 600;
	letter-spacing: 0.04em;
	color: var(--parchment);
}
#status {
	min-height: 20px;
	margin: 0 0 12px;
	font-size: 13px;
	line-height: 1.45;
	color: var(--muted);
}
#status.error {
	color: var(--error);
	text-align: left;
}
.bar {
	height: 10px;
	border: 2px solid var(--edge);
	border-radius: 2px;
	background: #120f0c;
	overflow: hidden;
}
#fill {
	height: 100%;
	width: 0;
	background: linear-gradient(#e8c983, #b8914a);
	transition: width 0.2s linear;
}
.bar.waiting #fill {
	width: 30%;
	animation: sweep 1.2s ease-in-out infinite alternate;
}
@keyframes sweep {
	from { margin-left: 0; }
	to { margin-left: 70%; }
}
#amount {
	margin-top: 8px;
	font-size: 12px;
	color: var(--muted);
	font-variant-numeric: tabular-nums;
}
#retry {
	display: none;
	margin: 16px auto 0;
	padding: 8px 22px;
	font: inherit;
	font-size: 14px;
	font-weight: 600;
	color: var(--gold);
	background: var(--title-bg);
	border: 2px solid var(--edge);
	border-radius: 3px;
	cursor: pointer;
}
#retry:hover {
	border-color: var(--gold);
}
@media (max-aspect-ratio: 4/3) {
	#loader {
		justify-content: center;
		padding-right: 0;
	}
}
</style>
$GODOT_HEAD_INCLUDE
</head>

<canvas id="canvas">Your browser does not support the canvas element.</canvas>

<div id="loader">
	<div class="panel">
		<div class="title">ELUSION RPG</div>
		<div id="status">Getting the game ready...</div>
		<div class="bar waiting" id="bar"><div id="fill"></div></div>
		<div id="amount">&nbsp;</div>
		<button id="retry" type="button">Try again</button>
	</div>
</div>

<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loader = document.getElementById('loader');
	const status = document.getElementById('status');
	const bar = document.getElementById('bar');
	const fill = document.getElementById('fill');
	const amount = document.getElementById('amount');
	const retry = document.getElementById('retry');
	let done = false;
	// The engine names the tab after the project ("ElusionRPG") as it starts;
	// the page's own title is the game's name, so it goes back when the game
	// is up.
	const pageTitle = document.title;

	function megabytes(bytes) {
		return (bytes / 1048576).toFixed(1);
	}

	// THE GAME SAYS WHEN IT IS UP. loginmenu.gd calls this once its screen has
	// drawn; until then the canvas holds the engine's boot splash, and taking
	// the loader away early shows it.
	function reveal() {
		if (done) {
			return;
		}
		done = true;
		document.title = pageTitle;
		loader.classList.add('gone');
		setTimeout(function () { loader.remove(); }, 400);
		document.getElementById('canvas').focus();
	}
	window.elusionReady = reveal;

	function fail(message) {
		done = true;
		bar.style.display = 'none';
		amount.style.display = 'none';
		status.className = 'error';
		status.textContent = message;
		retry.style.display = 'block';
	}
	retry.addEventListener('click', function () { window.location.reload(); });

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		// In the words a player can act on. The list is still there for a
		// report: a browser too old for WebGL 2 says so by name.
		fail('This browser cannot run Elusion. It needs WebGL 2 and WebAssembly, '
			+ 'which every current Chrome, Edge, Firefox and Safari has. Missing: '
			+ missing.join(', ') + '.');
		retry.style.display = 'none';
		return;
	}

	status.textContent = 'Downloading the game...';
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				bar.classList.remove('waiting');
				fill.style.width = Math.min(100, (100 * current) / total).toFixed(1) + '%';
				amount.textContent = megabytes(current) + ' of ' + megabytes(total) + ' MB';
				if (current >= total) {
					status.textContent = 'Starting...';
				}
			} else {
				bar.classList.add('waiting');
			}
		},
	}).then(function () {
		status.textContent = 'Starting...';
		amount.innerHTML = '&nbsp;';
		// A build that never calls elusionReady still gets its canvas back.
		setTimeout(reveal, 15000);
	}, function (err) {
		console.error(err);
		fail('The game could not load (' + (err && err.message ? err.message : String(err))
			+ '). Check your connection and try again.');
	});
}());
</script>
</body>
</html>
